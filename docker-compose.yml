version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        # En Linux el bind mount conserva el propietario real: si el usuario
        # del host no coincide con el del contenedor, este no puede escribir
        # en storage/. Se ponen en el .env de la raiz, o al vuelo con
        # UID=$(id -u) GID=$(id -g) docker compose build
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cerseuletras_app
    working_dir: /var/www/html
    volumes:
      - ./cerseuletras:/var/www/html
    depends_on:
      - db
    networks:
      - laravel-network
    environment:
      # Solo la URL. APP_ENV y APP_DEBUG viven en cerseuletras/.env, no aquí:
      # una variable de entorno del contenedor gana sobre el .env y además se
      # cuela en $_SERVER, donde PHPUnit no puede pisarla —con APP_ENV clavado,
      # la suite entera corría fuera del entorno de pruebas.
      - APP_URL=https://cerseuletras.unmsm.edu.pe

  # Nginx Web Server
  web:
    image: nginx:stable-alpine
    container_name: cerseuletras_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cerseuletras:/var/www/html
      # La conf va como PLANTILLA: el entrypoint de nginx sustituye las
      # variables y escribe el resultado en /etc/nginx/conf.d/. Antes el
      # dominio estaba escrito a mano dentro del .conf, de modo que
      # levantar el sistema en otro dominio exigia editar codigo.
      - ./docker/nginx/templates/default-ssl.conf.template:/etc/nginx/templates/default.conf.template
      - ./docker/nginx/ssl_sectigo:/etc/nginx/ssl_sectigo
      - ./docker/nginx/compression.conf:/etc/nginx/compression.conf
      # El reparto entre el sitio estatico y Laravel, compartido por las dos
      # plantillas. No va como plantilla porque no lleva variables: envsubst
      # solo procesa /etc/nginx/templates/.
      - ./docker/nginx/sitio.conf:/etc/nginx/sitio.conf
      # El sitio publico: el `dist/` que genera Astro. Nginx lo sirve tal cual,
      # sin pasar por PHP.
      - ./sitio/dist:/var/www/sitio:ro
    depends_on:
      - app
    networks:
      - laravel-network
    environment:
      # Lista completa de server_name, separada por espacios.
      - NGINX_SERVER_NAMES=${NGINX_SERVER_NAMES:-cerseuletras.unmsm.edu.pe www.cerseuletras.unmsm.edu.pe}
      # Solo se sustituyen las variables cuyo NOMBRE empieza por NGINX_.
      # Sin este filtro, envsubst se comeria tambien $$server_name,
      # $$request_uri y $$fastcgi_script_name, y nginx no arrancaria.
      - NGINX_ENVSUBST_FILTER=^NGINX_

  # Redis: cache, sesiones y colas.
  #
  # Las colas son el motivo principal. El aviso de una solicitud se enviaba
  # en la misma peticion y con un solo intento: si el SMTP estaba caido un
  # minuto, el aviso se perdia hasta que alguien mirara `leads.aviso_error` y
  # reenviara a mano.
  redis:
    image: redis:7-alpine
    container_name: cerseuletras_redis
    restart: unless-stopped
    # `appendonly` para que la cola sobreviva a un reinicio del contenedor:
    # sin persistencia, un `docker compose restart` tira los trabajos que
    # estuvieran esperando.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

  # Trabajador de la cola. Vive aparte de `app` a proposito: si el proceso
  # muere, lo reinicia Docker sin arrastrar al servidor web.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cerseuletras_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./cerseuletras:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - laravel-network
    # --tries y --backoff se declaran en el Job; aqui solo el ciclo de vida.
    # `--max-time` recicla el proceso cada hora: PHP de larga duracion acumula
    # memoria y estado, y un trabajador eterno acaba sirviendo codigo viejo.
    command: php artisan queue:work redis --sleep=3 --max-time=3600

  # MySQL Database
  # Base de Datos
  # Construccion del sitio publico.
  #
  # Dos oficios en un solo contenedor, y por eso vive aqui y no en la capa de
  # desarrollo:
  #
  #   - Escucha en /reconstruir. Publicar desde el panel encola un trabajo que
  #     pide una reconstruccion, y este servicio la ejecuta: sin el, el sitio
  #     se queda con el contenido de la ultima construccion manual.
  #   - Es donde se lanza el build a mano:
  #       docker compose run --rm build npm run build
  #
  # `CERSEU_API` apunta al nombre del servicio de Nginx dentro de la red. No
  # sirve localhost: ahi dentro seria este mismo contenedor.
  build:
    image: node:22-alpine
    container_name: cerseuletras_build
    restart: unless-stopped
    working_dir: /app
    environment:
      - CERSEU_API=http://web/api/v1
      - CERSEU_SITE=${CERSEU_SITE:-https://cerseuletras.unmsm.edu.pe}
      - CERSEU_BUILD_TOKEN=${CERSEU_BUILD_TOKEN:-token-de-desarrollo}
      # Vista previa: sin este token el servicio la rechaza. Vacio la
      # desactiva, que es lo que debe pasar en una instalacion sin configurar.
      - CERSEU_VISTA_PREVIA_TOKEN=${CERSEU_VISTA_PREVIA_TOKEN:-}
      - PUERTO_BUILD=4322
    volumes:
      - ./sitio:/app
      # node_modules en volumen nombrado, por lo mismo que vendor/ en la app.
      - node-modules-build:/app/node_modules
    depends_on:
      - web
    networks:
      - laravel-network
    command: sh -c "npm install && node herramientas/servidor-de-build.mjs"

  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: cerseuletras_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-cerseuletras}
      MYSQL_USER: ${DB_USERNAME:-cerseu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  redis-data:
  node-modules-build:
  db-data:

networks:
  laravel-network:
    driver: bridge
