# Reparto entre el sitio estático y Laravel.
#
# Se incluye desde las dos plantillas —HTTP y HTTPS— para que no puedan
# divergir: hasta ahora el mismo bloque estaba escrito dos veces y arreglar algo
# en una no lo arreglaba en la otra.
#
# La raíz es el `dist/` de Astro: el sitio público son ficheros, y Nginx los
# entrega sin despertar a PHP. Laravel conserva solo lo que no es contenido
# público —el panel, la API, la sesión y los ficheros subidos— y esa lista está
# escrita entera aquí abajo, en un sitio, para poder leerla de un vistazo.

root /var/www/sitio;
index index.html;

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log;

client_max_body_size 100M;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss application/xhtml+xml application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject image/svg+xml;
gzip_min_length 256;

# --- Ficheros que nunca deben servirse -------------------------------------

location ~ /\.ht {
    deny all;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~ ^/(\.git|\.env|\.env\.example|bootstrap/cache|config|node_modules|vendor) {
    deny all;
    access_log off;
    log_not_found off;
}

location ^~ /.well-known/acme-challenge/ {
    allow all;
    root /var/www/html/public;
}

# --- Direcciones anteriores -------------------------------------------------
#
# El sitio estuvo publicado como Unidad de Posgrado y hay enlaces sueltos por
# ahí. Los redirigía Laravel; ahora que Laravel ya no ve estas rutas, los
# redirige quien las recibe.

location = /diplomados          { return 301 /talleres; }
location = /diplomados/admision { return 301 /talleres/admision; }
location = /programas           { return 301 /cursos; }

# --- Laravel ----------------------------------------------------------------
#
# Todo lo que Laravel sigue atendiendo, enumerado. Lo que no esté en esta lista
# es sitio estático: así, añadir una página a Astro no exige tocar Nginx, y
# nada de Laravel queda expuesto por descuido.
#
#   api            la API de contenido y el envío del formulario
#   panel          el panel de administración (Filament)
#   livewire*      las peticiones de Livewire, sobre las que corre Filament.
#                  Lleva comodin porque Livewire 4 sirve sus assets bajo un
#                  prefijo con hash —`/livewire-41ead393/livewire.js`—, y sin
#                  el comodin ese fichero daba 404: el panel cargaba entero
#                  pero sin JavaScript, o sea sin poder guardar nada.
#   login/logout   sesión, y el resto del flujo de contraseñas
#   profile        la cuenta de quien administra
#   gestion        vista previa de borradores y exportación de solicitudes: no
#                  son pantallas del panel, pero lo sostienen.
#
# «admin» ya no está: el panel Blade se retiró cuando Filament alcanzó paridad.
# Dejarlo aquí solo mantendría abierto un espacio de URLs sin nada detrás.

location ~ ^/(api|panel|gestion|livewire[-\w]*|login|logout|profile|password|forgot-password|reset-password|confirm-password|verify-email|email)(/|$) {
    root /var/www/html/public;
    try_files $uri /index.php?$query_string;
}

location ~ \.php$ {
    root /var/www/html/public;
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    # Con el nombre escrito tal cual, nginx resuelve la IP de `app` una sola vez,
    # al arrancar: si luego se recrea `app` sin reiniciar `web`, la IP cambia y
    # todo PHP devuelve 502. Pasarlo por una variable obliga a resolverlo en
    # cada peticion contra el DNS interno de Docker (127.0.0.11).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;
    fastcgi_pass $php_fpm;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # `$https` vale «on» solo cuando la peticion llego cifrada, asi que el mismo
    # bloque sirve para el servidor de HTTP y el de HTTPS. Escribirlo a mano
    # obligaba a mantener dos copias del bloque de PHP.
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 300;
}

# Ficheros subidos desde el panel.
location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;
    try_files $uri $uri/ =404;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Una imagen subida no se ejecuta.
    location ~ \.php$ {
        deny all;
        return 403;
    }
}

# Imágenes y assets que viven en el `public/` de Laravel: las referencian tanto
# el panel como la API —`/images/profesor-default.jpg` acaba en el HTML que
# genera Astro—.
location ^~ /images/ {
    root /var/www/html/public;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# Hojas, guiones y tipografías que publica Filament con `filament:install`.
# Van al `public/` de Laravel, no al sitio estático, así que sin esto el panel
# cargaba sin estilos: el HTML llegaba bien y los assets daban 404.
location ~ ^/(css|js|fonts)/filament/ {
    root /var/www/html/public;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location ^~ /build/ {
    root /var/www/html/public;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location = /favicon.ico {
    root /var/www/html/public;
    access_log off;
    log_not_found off;
}

# --- Sitio estático ---------------------------------------------------------

# Ficheros con hash en el nombre: cambian de nombre al cambiar de contenido,
# así que se pueden cachear para siempre sin miedo a servir una versión vieja.
location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# El índice del buscador y el sitemap se rehacen en cada build: cachearlos
# mucho dejaría el buscador encontrando cosas que ya no están.
location ~ ^/(indice-busqueda\.json|sitemap[^/]*\.xml|robots\.txt)$ {
    expires 10m;
    add_header Cache-Control "public, must-revalidate";
}

location / {
    # Astro genera `/cursos/index.html`, no `/cursos`. Sin `$uri/index.html` la
    # dirección sin barra final daría 404.
    try_files $uri $uri/index.html $uri.html =404;

    # El HTML no se cachea en el navegador: publicar desde el panel reconstruye
    # el sitio, y una página cacheada haría invisible el cambio durante horas.
    # Va aquí y no solo en el bloque `\.html$` porque las direcciones reales
    # son `/talleres/x/`: `try_files` entrega el `index.html` sin volver a
    # elegir bloque, y ese bloque nunca llegaba a aplicarse.
    #
    # `expires` y no `add_header`: un `add_header` en el bloque anula los de
    # nivel servidor, y la página saldría sin HSTS ni las demás cabeceras de
    # seguridad. `no-cache` no impide guardar la copia, obliga a preguntar
    # antes de usarla: si no cambió, Nginx responde 304 y no se reenvía nada.
    expires -1;

    # Solo aquí, no en el servidor entero: a nivel de servidor lo heredarían
    # también los bloques de Laravel, y `/api/v1/loquesea` devolvería la página
    # 404 en HTML en vez del JSON que espera quien llama a la API.
    error_page 404 /404.html;
}

# Lo mismo para quien pide el `.html` por su nombre (ver `location /`).
location ~* \.html$ {
    expires -1;
}

location = /404.html {
    internal;
}
